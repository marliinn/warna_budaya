<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#122d2d">
    <title>Preview Konsep Logo — WARNA BUDAYA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: clamp(12px, 3vw, 36px);
            background: #10191f;
        }
        img {
            width: min(100%, 1120px);
            height: auto;
            display: block;
            border: 1px solid rgba(241, 210, 140, .3);
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }
    </style>
</head>
<body>
    <img src="/images/brand-concept-preview.svg" alt="Lembar preview konsep identitas WARNA BUDAYA, menampilkan variasi emblem, logo horizontal, dan logo vertikal.">
